name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check that the tag matches the package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)
          init=$(grep -m1 '^__version__ = ' src/flowprompt/__init__.py | cut -d'"' -f2)
          if [ "$tag" != "$pkg" ] || [ "$tag" != "$init" ]; then
            echo "Tag v$tag does not match pyproject ($pkg) / __version__ ($init)."
            exit 1
          fi

      - name: Install dependencies
        run: |
          uv venv
          uv sync --all-extras

      - name: Run tests
        run: uv run pytest -v

      - name: Build package
        run: uv build

      - name: Check distribution
        run: |
          uv run pip install twine
          uv run twine check dist/*

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: uv run twine upload dist/*

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
