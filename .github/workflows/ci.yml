name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          uv venv
          uv sync --all-extras

      - name: Run tests
        run: uv run pytest --cov --cov-report=xml -v

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: ./coverage.xml
          fail_ci_if_error: false

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          uv venv
          uv sync --all-extras

      - name: Run ruff check
        run: uv run ruff check .

      - name: Run ruff format check
        run: uv run ruff format --check .

      - name: Run mypy
        run: uv run mypy src/flowprompt

  examples:
    name: Examples and README (offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # uv.lock is not committed, so this resolves the latest releases of all
      # dependencies and catches upstream changes that break the docs.
      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run every example against the offline FakeLLM
        run: uv run python scripts/run_examples.py

      - name: Run README and example tests
        run: uv run pytest tests/test_docs_examples.py --no-cov -v

  pydantic-compat:
    name: Core on pydantic ${{ matrix.pydantic }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pydantic: ["2.0.3", "2.9.2", "2.*"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pydantic ${{ matrix.pydantic }} and core dependencies
        run: |
          uv venv
          uv pip install "pydantic==${{ matrix.pydantic }}" jinja2 pyyaml pytest pytest-asyncio

      - name: Prompt definition and YAML tests
        env:
          PYTHONPATH: src
        run: >
          .venv/bin/python -m pytest -c /dev/null -p no:cacheprovider
          tests/test_core/test_unannotated_prompts.py tests/test_core/test_prompt.py
          tests/test_storage

  build:
    runs-on: ubuntu-latest
    needs: [test, lint, examples, pydantic-compat]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build package
        run: uv build

      - name: Check distribution
        run: |
          uv venv
          uv run pip install twine
          uv run twine check dist/*

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
