<text x="32.0" y="64.0" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b6b70" text-anchor="start">Two prompts, 100 inputs, one run each; inputs share difficulty, as in real evals. 4,000 experiments per point; bands are 95% intervals.</text>
