site_name: FlowPrompt
site_description: Typed prompts and statistically sound prompt A/B tests for Python.
site_url: https://yotambraun.github.io/flowprompt/
repo_url: https://github.com/yotambraun/flowprompt
repo_name: yotambraun/flowprompt
edit_uri: edit/main/docs/
copyright: MIT License

exclude_docs: |
  ROADMAP-next.md

theme:
  name: material
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: white
      accent: blue
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: blue
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - search.highlight
    - toc.follow

nav:
  - Home: index.md
  - Getting started:
      - Installation: installation.md
      - Quick start: quickstart.md
  - Guides:
      - A/B testing: ab-testing.md
      - Prompt tests in CI: ci.md
      - Caching, tracing and cost: observability.md
      - Optimization: optimization.md
      - Multimodal: multimodal.md
  - Statistics:
      - Statistical methods: statistics.md
      - "Your prompt A/B test is probably lying to you": false-winners.md
  - Reference:
      - API overview: api.md
      - Python API: reference.md
  - Changelog: changelog.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: false
            show_root_heading: true
            show_signature_annotations: true
            separate_signature: true
            members_order: source
            heading_level: 3

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/yotambraun/flowprompt
